<script>
    // ⚠️ حط هنا إحداثيات الشركة الحقيقية (خط العرض وخط الطول)
    const COMPANY_LAT = 30.030138; // غيرها بإحداثيات شركتك

    const ALLOWED_DISTANCE = 0.1; // المسافة المسموحة بالكيلومتر (هنا 100 متر)

// إحداثيات الشركة والمسافة
const COMPANY_LAT = 30.030178; 
const COMPANY_LON = 31.112698; 
const ALLOWED_DISTANCE = 0.2; // 200 متر

const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw2bZ_4Y2gI0aRdzv-g_xq9GZo46di..."; // رابط جوجل شيت القديم بتاعك

function registerAttendance() {
    const nameInput = document.getElementById('employeeName');
    let name = nameInput.value.trim();
    const action = document.getElementById('actionType').value;
    const msg = document.getElementById('message');

    if (!name) {
        alert("من فضلك اكتب اسمك أولاً!");
        return;
    }

    // حفظ الاسم لأول مرة وقفل الحقل نهائياً
    if (!localStorage.getItem('employee_saved_name')) {
        localStorage.setItem('employee_saved_name', name);
        nameInput.disabled = true;
        nameInput.style.backgroundColor = "#e9ecef";
        nameInput.style.cursor = "not-allowed";
    }

    if (!navigator.geolocation) {
        alert("متصفحك لا يدعم تحديد الموقع الجغرافي (GPS).");
        return;
    }

    msg.innerText = "جاري التحقق من موقعك الحالي...";

    navigator.geolocation.getCurrentPosition(
        function (position) {
            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            // حساب المسافة بين الموظف والشركة بالكيلومتر
            const distance = calculateDistance(userLat, userLon, COMPANY_LAT, COMPANY_LON);

            if (distance <= ALLOWED_DISTANCE) {
                msg.innerText = "جاري إرسال البصمة...";
                
                // إرسال البيانات لجوجل شيت
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, action: action, lat: userLat, lon: userLon })
                })
                .then(() => {
                    msg.style.color = "#28a745";
                    msg.innerText = "تم تسجيل " + action + " بنجاح! ✅";
                })
                .catch((error) => {
                    msg.style.color = "red";
                    msg.innerText = "حدث خطأ أثناء الإرسال!";
                });

            } else {
                msg.style.color = "red";
                msg.innerText = "أنت بعيد عن نطاق الشركة! المسافة الحالية: " + (distance * 1000).toFixed(0) + " متر ❌";
            }
        },
        function (error) {
            msg.style.color = "red";
            msg.innerText = "فشل في تحديد الموقع. تأكد من تفعيل الـ GPS ومحاولة التحديد.";
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

// دالة لحساب المسافة الرياضية بين خطوط الطول والعرض
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // نصف قطر الأرض بالكيلومتر
    const dLat = deg2rad(lat2 - lat1);
    const dLon = deg2rad(lon2 - lon1);
    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function deg2rad(deg) {
    return deg * (Math.PI / 180);
}
    function sendDataToSheet(name, action, status) {
        const data = {
            name: name,
            action: action,
            status: status
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        }).then(() => {
            msg.style.color = "green";
            msg.innerText = "تم تسجيل " + action + " بنجاح!";
            document.getElementById('employeeName').value = "";
        }).catch(err => {
            msg.style.color = "red";
            msg.innerText = "حدث خطأ أثناء الاتصال بالسيرفر.";
        });
    }
</script>
